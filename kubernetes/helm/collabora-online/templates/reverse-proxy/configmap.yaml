{{- if .Values.reverseProxy.enabled -}}
{{- $fullName := include "collabora-online.fullname" . -}}
{{- $headless := printf "%s-reverseproxy-headless" $fullName -}}
{{- $port := .Values.reverseProxy.upstreamPort | default .Values.deployment.containerPort -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-reverseproxy
  labels:
    {{- include "collabora-online.reverseproxy.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{- if .Values.reverseProxy.nginxConfigOverride }}
{{ .Values.reverseProxy.nginxConfigOverride | indent 4 }}
{{- else }}
    worker_processes auto;
    pid /run/nginx/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        # Send "Connection: upgrade" only for real WebSocket requests. Plain
        # HTTP requests get "Connection: close", otherwise Collabora holds the
        # connection open waiting for a WebSocket upgrade that never arrives.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        upstream coolwsd {
            zone coolwsd 64k;
{{- if .Values.reverseProxy.endpointReloader.enabled }}
            # The consistent form places each server line on a ring by its
            # address, so the order of the lines does not matter. When a pod
            # comes or goes, only the parameter values on that pod's part of
            # the ring move, and every other document stays on its pod. The
            # reloader writes one server line per pod into the included file.
            hash $arg_{{ .Values.reverseProxy.hashParam }} consistent;
            include /etc/nginx/upstreams/coolwsd.conf;
{{- else }}
            # One name stands for every pod here. nginx resolves it when it
            # starts and picks a pod by its position in the resolved list.
            hash $arg_{{ .Values.reverseProxy.hashParam }};
            server {{ $headless }}.{{ .Release.Namespace }}.svc.cluster.local:{{ $port }};
{{- end }}
        }
        {{- if .Values.reverseProxy.controller.enabled }}

        upstream controller {
            server {{ required "reverseProxy.controller.upstream is required when reverseProxy.controller.enabled is true" .Values.reverseProxy.controller.upstream }};
        }
        {{- end }}

        server {
            listen {{ .Values.reverseProxy.containerPort }};
            server_name _;

            location = /nginx-health {
                return 200 "ok\n";
            }
            {{- if .Values.reverseProxy.controller.enabled }}

            location ~* ^/controller(/|$) {
                proxy_pass               http://controller;
                proxy_http_version       1.1;
                proxy_set_header         Host $host;
                proxy_set_header         Upgrade $http_upgrade;
                proxy_set_header         Connection $connection_upgrade;
                client_max_body_size     0;
                proxy_read_timeout       {{ .Values.reverseProxy.proxyTimeout }};
                proxy_send_timeout       {{ .Values.reverseProxy.proxyTimeout }};
            }
            {{- end }}

            location / {
                proxy_pass               http://coolwsd;
                proxy_http_version       1.1;
                proxy_set_header         Host $host;
                proxy_set_header         Upgrade $http_upgrade;
                proxy_set_header         Connection $connection_upgrade;
                client_max_body_size     0;
                proxy_read_timeout       {{ .Values.reverseProxy.proxyTimeout }};
                proxy_send_timeout       {{ .Values.reverseProxy.proxyTimeout }};
            }
        }
    }
{{- end }}
{{- if .Values.reverseProxy.endpointReloader.enabled }}
  # Writes one nginx server line per pod address in the EndpointSlices to the
  # file named as its argument. A pod that is starting or stopping is listed
  # too. A starting pod refuses the connection and nginx tries the next pod.
  # A stopping pod still holds its documents. The lines are sorted and unique,
  # so the same set of pods always gives the same file. It exits with 0 when
  # at least one pod is listed, and the file then holds that list. It exits
  # with 1 when no pod is listed, and leaves the file as it was, because nginx
  # does not load an upstream without servers.
  render-upstream.sh: |
    #!/bin/sh
    set -u
    NAMESPACE="{{ .Release.Namespace }}"
    SELECTOR="kubernetes.io/service-name={{ $headless }}"
    PORT="{{ $port }}"
    target="$1"
    next="$target.next"
    kubectl get endpointslices -n "$NAMESPACE" -l "$SELECTOR" \
      -o jsonpath={{ `'{range .items[*].endpoints[*]}{.addresses[0]}{"\n"}{end}'` }} \
      | awk -v port="$PORT" {{ `'$1 != "" { address = $1; if (index(address, ":")) address = "[" address "]"; print "server " address ":" port ";" }'` }} \
      | sort -u > "$next"
    if [ -s "$next" ]; then
        mv "$next" "$target"
        exit 0
    fi
    rm -f "$next"
    exit 1
{{- end }}
{{- end }}
